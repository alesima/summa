{% extends "base.html" %}
{% block title %}FX rates - summa{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Exchange rates</h1>
<div class="card p-4 mb-6">
  <table>
    <thead><tr><th>Base</th><th>Quote</th><th>Rate</th><th>Updated</th></tr></thead>
    <tbody>{% for r in rows %}<tr><td>{{ r.base_currency }}</td><td>{{ r.quote_currency }}</td><td>{{ r.rate }}</td><td>{{ r.updated_at }}</td></tr>{% endfor %}</tbody>
  </table>
</div>
<div class="card p-6 max-w-lg">
  <h2 class="font-bold mb-3">Set rate</h2>
  <form method="post" action="/fx/set" class="space-y-3">
    <input class="inp" name="base" placeholder="Base (e.g. USD)" required>
    <input class="inp" name="quote" placeholder="Quote (e.g. BRL)" required>
    <input class="inp" name="rate" type="number" step="0.0001" placeholder="Rate" required>
    <button class="btn" type="submit">Set</button>
  </form>
</div>
{% endblock %}
