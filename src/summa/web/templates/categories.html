{% extends "base.html" %}
{% block title %}{{ t('categories') }} - summa{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">{{ t('categories') }}</h1>
<div class="card p-4 mb-6">
  <table>
    <thead><tr><th>ID</th><th>{{ t('name') }}</th><th>{{ t('kind') }}</th></tr></thead>
    <tbody>{% for c in rows %}<tr><td>{{ c.id }}</td><td>{{ c.name }}</td><td>{{ c.kind }}</td></tr>{% endfor %}</tbody>
  </table>
</div>
<div class="card p-6 max-w-lg">
  <h2 class="font-bold mb-3">{{ t('add_category') }}</h2>
  <form method="post" action="/categories/add" class="space-y-3">
    <input class="inp" name="name" placeholder="Name" required>
    <select class="inp" name="kind"><option>expense</option><option>income</option><option>transfer</option></select>
    <button class="btn" type="submit">{{ t('add') }}</button>
  </form>
</div>
{% endblock %}
