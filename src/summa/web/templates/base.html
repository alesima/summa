<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}summa{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
    .btn { background: #22c55e; color: #0f172a; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 600; }
    .btn:hover { background: #16a34a; }
    .inp { background: #0f172a; border: 1px solid #475569; border-radius: 0.5rem; padding: 0.5rem; color: #e2e8f0; width: 100%; }
    table { width: 100%; }
    th, td { padding: 0.5rem; }
    th { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; }
    tr { border-bottom: 1px solid #334155; }
  </style>
</head>
<body class="min-h-screen">
  <nav class="bg-slate-900 border-b border-slate-700 px-6 py-4 flex items-center gap-6">
    <span class="text-xl font-bold text-green-400">summa</span>
    <a href="/" class="hover:text-green-400">Dashboard</a>
    <a href="/transactions" class="hover:text-green-400">Transactions</a>
    <a href="/budgets" class="hover:text-green-400">Budgets</a>
    <a href="/import" class="hover:text-green-400">Import</a>
    <a href="/ask" class="hover:text-green-400">Ask AI</a>
  </nav>
  <main class="p-6 max-w-6xl mx-auto">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
