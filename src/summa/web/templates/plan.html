{% extends "base.html" %}
{% block title %}Plan - summa{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">AI financial plan</h1>
<div class="card p-6 mb-6">
  <form hx-post="/plan" hx-target="#plan-result" hx-indicator="#plan-spinner" class="space-y-3">
    <input class="inp" name="salary" type="number" step="0.01" placeholder="{{ t('monthly_salary') }}" value="{{ salary or '' }}">
    <input class="inp" name="context" placeholder="{{ t('context') }}" value="{{ context or '' }}">
    <input class="inp" name="goal" placeholder="{{ t('goal') }}" value="{{ goal or '' }}">
    <button class="btn" type="submit">{{ t('generate_plan') }}</button>
  </form>
</div>
<div class="card p-6" id="plan-result">
  <div id="plan-spinner" class="htmx-indicator flex items-center gap-3 muted">
    <div class="w-5 h-5 border-2 border-t-transparent rounded-full animate-spin" style="border-color: var(--accent); border-top-color: transparent;"></div>
    <span>{{ t('thinking') }}</span>
  </div>
  {% if answer %}<div class="md-content">{{ answer }}</div>{% endif %}
</div>
{% endblock %}
