<table>
  <thead><tr><th>ID</th><th>{{ t('date') }}</th><th>{{ t('account') }}</th><th class="description">{{ t('description') }}</th><th>{{ t('category') }}</th><th class="text-right">{{ t('amount') }}</th></tr></thead>
  <tbody>
  {% for t in rows %}
    <tr>
      <td>{{ t.id }}</td>
      <td><span class="fmt-date" data-iso="{{ t.date }}">{{ t.date|datefmt }}</span></td>
      <td>{{ t.account_name }}</td>
      <td class="description">{{ t.description }}</td>
      <td>{{ t.category_name or '-' }}</td>
      <td class="text-right {% if t.amount_cents > 0 %}text-green-400{% else %}text-red-400{% endif %}">{{ "%.2f"|format(t.amount_cents/100) }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
